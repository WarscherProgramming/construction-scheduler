
services:
  - type: web
    name: construction-scheduler-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://construction-scheduler-eight.vercel.app
      - key: JWT_ISSUER
        value: fieldflow-api
      - key: JWT_AUDIENCE
        value: fieldflow-web
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_PATH
        value: /auth
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: s3
      - key: ATTACHMENT_S3_BUCKET
        sync: false
      - key: ATTACHMENT_S3_REGION
        sync: false
      - key: ATTACHMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: ATTACHMENT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ATTACHMENT_S3_KEY_PREFIX
        value: fieldflow/attachments
      - key: DOCUMENT_EXTRACTION_ENABLED
        value: true
      - key: DOCUMENT_OCR_ENABLED
        value: false
      - key: DOCUMENT_OCR_PROVIDER
        value: disabled

  - type: cron
    name: construction-scheduler-document-extraction
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.commands.process_document_extractions --max-jobs 25 --prune-completed
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://construction-scheduler-eight.vercel.app
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: s3
      - key: ATTACHMENT_S3_BUCKET
        sync: false
      - key: ATTACHMENT_S3_REGION
        sync: false
      - key: ATTACHMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: ATTACHMENT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ATTACHMENT_S3_KEY_PREFIX
        value: fieldflow/attachments
      - key: DOCUMENT_EXTRACTION_ENABLED
        value: true
      - key: DOCUMENT_OCR_ENABLED
        value: false
      - key: DOCUMENT_OCR_PROVIDER
        value: disabled
