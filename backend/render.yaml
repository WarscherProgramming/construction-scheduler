
services:
  - type: web
    name: construction-scheduler-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://construction-scheduler-eight.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: s3
      - key: ATTACHMENT_S3_BUCKET
        sync: false
      - key: ATTACHMENT_S3_REGION
        sync: false
      - key: ATTACHMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: ATTACHMENT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ATTACHMENT_S3_KEY_PREFIX
        value: fieldflow/attachments
